<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title th:text="#{mural.titulo.aba}">Mural</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
<div th:insert="~{cabecalho :: siteHeader}"></div>

<h1 th:text="#{listar.titulo}">Mensagens</h1>

<ul>
    <li><a th:href="@{/}" th:text="#{menu.home}">Home</a></li>
    <li><a th:href="@{/postar}" th:text="#{index.link.postar}">Postar uma nova mensagem</a></li>
    <li><a th:href="@{/mensagens}" th:text="#{listar.link.atualizar}">Atualizar página</a></li>
    <li><a th:href="@{/logout}" th:text="#{index.link.logout}">Logout</a></li>
</ul>
<br>

<div th:if="${success}" th:text="${success}" class="success-message"></div>

<div th:if="${#lists.isEmpty(messages)}">
    <p th:text="#{listar.vazio}">Sem mensagens.</p>
</div>

<div th:unless="${#lists.isEmpty(messages)}">
    <h4 th:text="#{listar.contador(${messages.size()})}">Número de mensagens: 0</h4>

    <div th:each="msg : ${messages}">
        <div style="background-color: #ecf0f1; padding: 12px; border-radius: 6px; margin-bottom: 12px;">
            <div>
                <strong th:text="#{postar.label.de}">De:</strong> <span th:text="${msg.from()}"></span>
                &nbsp;
                <strong th:text="#{postar.label.para}">Para:</strong> <span th:text="${msg.to()}"></span>
                (<span th:text="#{listar.data.prefixo}">em</span> <span th:text="${msg.timestamp()}"></span>)
            </div>
            <div th:text="${msg.message()}"></div>
        </div>
    </div>
</div>

</body>
</html>
